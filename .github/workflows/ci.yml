# Continuous integration.
#
# Architecture contract section 15.4: CI runs on every push and every pull request, and all of
# it must pass: type checking, lint, unit tests, integration tests against a real PostgreSQL
# instance, dependency audit, and a secret scan.
#
# Everything here is pinned to an exact version. Section 15.4 requires the pipeline to be
# reproducible, and a floating action tag or image tag makes a green run today say nothing
# about a green run next month.
#
# What this workflow deliberately does NOT do: build or push a container image, deploy
# anything, or provision infrastructure. The API Dockerfile belongs to slices 2 and 3, and
# deployment machinery to the pre-customer phase, both per section 15.11.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the older run. Saves runner time without weakening
# the gate: only the latest commit needs to be green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24.16.0'

jobs:
  verify:
    name: Type check, lint, test, audit
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Same pinned image as docker-compose.yml. CI and local development must not drift
        # onto different database versions, or a constraint can pass in one and fail in the
        # other.
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Integration tests read these once the schema exists. Declared now so the connection
      # details live in one place rather than being invented per test file later.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: erp
      PGPASSWORD: erp_ci
      PGDATABASE: erp_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` installs strictly from the lockfile and fails if the lockfile and the
      # manifests disagree. Section 14.8 requires dependencies pinned by lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Wait for PostgreSQL
        run: pg_isready --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --timeout=30

      # Runs the same script Compose runs on first boot, against the CI service container.
      # Reusing the script rather than repeating the SQL is deliberate: two copies of a
      # security boundary drift, and the one that drifts is always the one nobody tests.
      - name: Create the owning and application roles
        env:
          # The script speaks the names the postgres image uses, so CI supplies them too
          # rather than the script learning a second set of names for one caller.
          POSTGRES_USER: erp
          POSTGRES_DB: erp_ci
          MIGRATION_DB_USER: erp_migrator
          MIGRATION_DB_PASSWORD: erp_migrator_ci
          APP_DB_USER: erp_app
          APP_DB_PASSWORD: erp_app_ci
        run: sh ./docker/postgres/init/01-roles.sh

      # Integration tests against a real PostgreSQL, as section 13.1 requires and section
      # 13.2 insists on. They connect as the restricted application role, so they also prove
      # the two role separation ratified in sections 2.4 and 7.1 actually holds.
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://erp_app:erp_app_ci@localhost:5432/erp_ci
        run: npm run test:int

      # Section 15.4 lists the dependency audit as a required gate. The threshold is `low`,
      # the strictest setting, because the tree currently has zero advisories at any level.
      # Section 14.9 forbids suppressing a finding to keep the build green: if this fails,
      # the dependency is fixed or removed, not whitelisted.
      - name: Dependency audit
        run: npm audit --audit-level=low

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. A secret removed from the working tree is still in the history, and
          # section 15.5 says an exposed secret is rotated rather than merely deleted. The
          # scan has to be able to see what was committed, not only what is checked out.
          fetch-depth: 0

      # Pinned release binary rather than a marketplace action, for two reasons: the version
      # is exact and auditable, and it avoids the organisation licence requirement that the
      # official action carries.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Non-zero exit on any finding fails the job, which is what section 14.8 requires.
      - name: Scan repository and history for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1
